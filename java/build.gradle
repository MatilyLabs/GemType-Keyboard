allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

apply plugin: 'com.android.application'

base {
    archivesName = "GemType"
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    // GemType (org.matily.gemtype): request coroutines and the encrypted API-key store.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation project(':ime')

    testImplementation 'junit:junit:4.13.2'
    // The android.jar org.json is a stub that throws in JVM unit tests.
    testImplementation 'org.json:json:20240303'
}

// Used in calculating version code for each APK in splits
ext.versionCodeOffsets = ['arm64-v8a': 1, 'armeabi-v7a': 0, 'x86_64': 2]

android {
    compileSdk = 37
    namespace = 'com.android.inputmethod.latin'

    kotlin {
        jvmToolchain(17)
    }

    defaultConfig {
        applicationId = "org.matily.gemtype"
        minSdk = 21
        targetSdk = 37
        versionCode = 1
        versionName = "1.0.0-alpha1"

        // Content provider authority, derived from the applicationId (debug overrides it below).
        resValue "string", "authority", "${applicationId}.dictionarypack"

        // GemType talks to Google's Gemini API. Debug builds can point at a local mock:
        //   ./gradlew assembleOnlineDebug -Pgemtype.apiBase=http://localhost:8765/v1beta/models
        buildConfigField "String", "GEMTYPE_API_BASE",
                '"https://generativelanguage.googleapis.com/v1beta/models"'
    }

    buildFeatures {
        buildConfig = true
        // Needed for the per-variant dictionary-pack authority (resValue below).
        resValues = true
    }

    // "online" is the normal build; "offline" bundles every language pack in the APK and
    // carries no INTERNET permission, for privacy-conscious installs.
    flavorDimensions = ["distribution"]
    productFlavors {
        online {
            dimension = "distribution"
            buildConfigField "boolean", "BUNDLED_LANGUAGE_PACKS", "false"
            buildConfigField "boolean", "GEMTYPE_ENABLED", "true"
        }
        offline {
            dimension = "distribution"
            versionNameSuffix = "-offline"
            buildConfigField "boolean", "BUNDLED_LANGUAGE_PACKS", "true"
            // No INTERNET permission in this flavor, so no GemType.
            buildConfigField "boolean", "GEMTYPE_ENABLED", "false"
        }
    }

    splits {
      abi {
        enable = true
        universalApk = false
        reset()
        include "armeabi-v7a", "arm64-v8a"
        // x86_64 (Intel emulators) is opt-in: `make build` passes -Px86=true; release doesn't.
        if (project.hasProperty('x86')) {
            include "x86_64"
        }
      }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', '../common/src']
            kotlin.srcDirs = ['src', '../common/src']
            jniLibs.srcDirs = ['jniLibs']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        offline {
            manifest.srcFile 'offline/AndroidManifest.xml'
            assets.srcDirs = ['offline/assets']
        }
        // Debug-only network security config: cleartext to localhost / 10.0.2.2 for the GemType mock.
        debug {
            manifest.srcFile 'debug/AndroidManifest.xml'
            res.srcDirs = ['debug/res']
        }
        // 'src' is a main source root, so keep JVM unit tests out of src/test.
        test {
            java.srcDirs = ['test']
            kotlin.srcDirs = ['test']
        }
        androidTest.setRoot('tests')
    }


    signingConfigs {
        release {
            storeFile = file(String.valueOf(System.getenv("INDIC_KEYSTORE")))
            storePassword = System.getenv("INDIC_KEYSTORE_PASSWORD")
            keyAlias = System.getenv("INDIC_KEY_ALIAS")
            keyPassword = System.getenv("INDIC_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            // Debug installs alongside the real app (org.matily.gemtype), never over it.
            applicationIdSuffix = ".debug"
            resValue "string", "authority", "org.matily.gemtype.debug.dictionarypack"
            def gemtypeApiBase = project.findProperty('gemtype.apiBase')
            if (gemtypeApiBase != null) {
                buildConfigField "String", "GEMTYPE_API_BASE", "\"${gemtypeApiBase}\""
            }
        }
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig = signingConfigs.release
        }
    }
    androidResources {
        noCompress '.dict'
    }
    lint {
        checkReleaseBuilds = false
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            // Uses a hardcoded lookup instead of loop index because in F-droid build
            // we overwrite splits and make only one output at a time.
            def abiFilter = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }
            if (abiFilter != null) {
                output.versionCode.set(
                    output.versionCode.get() + project.ext.versionCodeOffsets.get(abiFilter.identifier))
            }
        }
    }
}
