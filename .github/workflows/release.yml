# Release: push a tag like v1.2.3 (or run it from the Actions tab with a version).
#
#   1. tests, then a signed AAB (for Google Play) and signed APKs (for GitHub Releases)
#   2. a GitHub release v1.2.3 with the APKs attached
#   3. the AAB uploaded to Google Play's internal testing track, once the
#      PLAY_SERVICE_ACCOUNT_JSON secret exists (Play's first upload must be done by hand)
#
# Secrets (Settings > Secrets and variables > Actions):
#   GEMTYPE_KEYSTORE_BASE64    the upload keystore, base64-encoded
#   GEMTYPE_KEYSTORE_PASSWORD  its password
#   GEMTYPE_KEY_ALIAS          the key's alias
#   GEMTYPE_KEY_PASSWORD       the key's password
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service account key (optional until after the first upload)
# Variable (optional): PLAY_RELEASE_STATUS, "completed" by default; set it to "draft" while the app
# has never been published, because Play only accepts draft releases for a draft app.
#
# versionCode = (major * 10000 + minor * 100 + patch) * 10, so 1.2.3 is 102030. The AAB uses it as is;
# APK splits add 0 (armeabi-v7a) or 1 (arm64-v8a).

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the tag v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      # The keyboard engine (ime/) is a submodule; the other submodules are only needed to rebuild
      # the prebuilt native libraries and dictionaries, so they are left out.
      - name: Fetch the ime submodule
        run: git submodule update --init --depth 1 ime

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          v="${v#v}"
          if [[ ! "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"; exit 1
          fi
          code=$(( (BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]) * 10 ))
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Releasing $v (versionCode $code)"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GEMTYPE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GEMTYPE_KEYSTORE_BASE64 is not set (Settings > Secrets and variables > Actions)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GEMTYPE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test and build
        working-directory: java
        env:
          GEMTYPE_KEYSTORE_PASSWORD: ${{ secrets.GEMTYPE_KEYSTORE_PASSWORD }}
          GEMTYPE_KEY_ALIAS: ${{ secrets.GEMTYPE_KEY_ALIAS }}
          GEMTYPE_KEY_PASSWORD: ${{ secrets.GEMTYPE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -Pgemtype.versionCode="$VERSION_CODE" -Pgemtype.versionName="$VERSION" \
            testOnlineDebugUnitTest bundleOnlineRelease assembleOnlineRelease

      - name: Collect files
        run: |
          mkdir -p dist
          cp java/build/outputs/bundle/onlineRelease/*.aab "dist/GemType-$VERSION.aab"
          for f in java/build/outputs/apk/online/release/GemType-online-*-release.apk; do
            abi=$(basename "$f"); abi=${abi#GemType-online-}; abi=${abi%-release.apk}
            cp "$f" "dist/GemType-$VERSION-$abi.apk"
          done
          cp java/build/outputs/mapping/onlineRelease/mapping.txt "dist/mapping-$VERSION.txt"
          rm -f "$GEMTYPE_KEYSTORE"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: GemType-${{ env.VERSION }}
          path: dist/

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "GemType $VERSION" \
            --notes-file fastlane/metadata/android/en-US/changelogs/default.txt

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.matily.gemtype
          releaseFiles: dist/GemType-${{ env.VERSION }}.aab
          mappingFile: dist/mapping-${{ env.VERSION }}.txt
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
